# Native Home Assistant cards; no HACS or frontend dependencies.
title: "Dům – diagnostika"
views:
  -
    title: "Přehled"
    path: "overview"
    type: "sections"
    max_columns: 3
    sections:
      -
        type: "grid"
        cards:
          -
            type: "markdown"
            title: "Kotel · právě teď"
            content: |-
              ## {{ states('sensor.house_boiler_reason') }}
              {{ state_attr('sensor.house_boiler_reason','reason') or 'Čeká se na diagnostiku.' }}

              {% set runtime = states('sensor.house_boiler_on_today') %}
              {% if is_number(runtime) %}Dnes **{{ (runtime | float * 60) | round(0) | int }} min** sepnutí · **{{ states('sensor.house_boiler_cycles_today') }} běhů** (včetně běhu přes půlnoc).{% endif %}
              {% if is_state('switch.laundry_room_boiler_controller_l2','on') %}
              {% set deadline=state_attr('input_datetime.heating_boiler_deadline','timestamp') | float(0) %}
              {% if deadline > 0 %}Do bezpečnostního limitu zbývá **{{ ([0, (deadline-as_timestamp(now())) / 60] | max) | int }} min**.{% endif %}
              {% endif %}

              <small>Stav řídicího relé, nikoli měření hořáku. [Detail topení](/house-debug/heating)</small>
            grid_options:
              columns: 12
              rows: "auto"
          -
            type: "history-graph"
            title: "Povel kotli · 24 hodin"
            hours_to_show: 24
            entities:
              -
                entity: "switch.laundry_room_boiler_controller_l2"
                name: "Kotel"
            grid_options:
              columns: 12
              rows: "auto"
          -
            type: "entities"
            title: "Řízení topení"
            show_header_toggle: false
            entities:
              -
                entity: "input_boolean.heating_enabled"
                name: "Topení povoleno"
              -
                type: "simple-entity"
                entity: "input_boolean.heating_safety_lock"
                name: "Nouzové zastavení kotle"
            grid_options:
              columns: 12
              rows: "auto"
          -
            type: "markdown"
            title: "Ochrana kotle"
            content: |-
              {% if is_state('input_boolean.heating_safety_lock','on') %}
              <ha-alert alert-type="warning">Topení je nouzově zastavené. Nejdřív zkontroluj příčinu, potom lze ochranu ručně odblokovat.</ha-alert>
              {% else %}**Ochrana je připravená, topení neblokuje.**{% endif %}

              Při běhu delším než 4 hodiny, chybě potvrzení povelu nebo nejasném běhu po restartu systém zastaví topení a zabrání dalšímu sepnutí. Vyžaduje kontrolu a ruční odblokování.
            grid_options:
              columns: 12
              rows: "auto"
      -
        type: "grid"
        cards:
          -
            type: "markdown"
            title: "Co potřebuje pozornost"
            content: |-
              {% set issues = state_attr('sensor.house_debug_attention','issues') %}
              {% if issues is none %}Diagnostika se načítá.
              {% elif not issues %}**Žádný problém ve sledovaných vstupech.**
              {% else %}
              {% for issue in issues %}
              - **{{ issue.title }}** — {{ issue.reason }}
              {% endfor %}
              {% endif %}

              [Otevřít dotčené entity](/house-debug/heating)
            grid_options:
              columns: 12
              rows: "auto"
          -
            type: "markdown"
            title: "Místnosti · proč topí / netopí"
            content: |-
              {%- set ns=namespace(rows=[]) -%}
              {%- for entity in ['sensor.heating_debug_bedroom', 'sensor.heating_debug_kids_room', 'sensor.heating_debug_workshop', 'sensor.heating_debug_entrance', 'sensor.heating_debug_downstairs_bathroom', 'sensor.heating_debug_downstairs_bathroom_floor', 'sensor.heating_debug_upstairs_bathroom', 'sensor.heating_debug_living_room'] -%}
              {%- set m=state_attr(entity,'measured') -%}{%- set t=state_attr(entity,'target') -%}
              {%- set ns.rows=ns.rows + ['| ' ~ state_attr(entity,'room_name') ~ ' | ' ~ (m if m is not none else '—') ~ ' → ' ~ (t if t is not none else '—') ~ ' °C | ' ~ states(entity) ~ ' |'] -%}
              {%- endfor -%}
              | Místnost | Teď → cíl | Stav |
              | :-- | --: | :-- |
              {{ ns.rows | join('\n') }}

              [Teploty, cíle a okna v čase](/house-debug/heating)
            grid_options:
              columns: 12
              rows: "auto"
      -
        type: "grid"
        cards:
          -
            type: "markdown"
            title: "Auto · nabíjení"
            content: |-
              {% set car=states('sensor.go_echarger_600187_car_state') %}
              **{{ dict(Idle='Odpojeno',Charging='Nabíjí',WaitCar='Čeká na auto',Complete='Dokončeno',Error='Chyba').get(car,car) }}**
              {% set energy=states('sensor.go_echarger_600187_energy_charged') %}
              {% if is_number(energy) %}
              {{ 'Aktuální relace' if car == 'Charging' else 'Poslední / probíhající relace' }}: **{{ (energy | float / 1000) | round(2) }} kWh**
              {% else %}Energie relace není dostupná.{% endif %}

              Limit nabíječky **{{ states('sensor.go_echarger_600187_allowed_charge_current') }} A** · dostupné **{{ states('sensor.ev_available_charging_current') }} A**.

              <small>Energie je údaj relace z nabíječky; při další relaci se může resetovat.</small>
            grid_options:
              columns: 12
              rows: "auto"
          -
            type: "tile"
            entity: "input_boolean.ev_dynamic_load_balancing_enabled"
            name: "Load balancing"
            tap_action:
              action: "more-info"
            icon_tap_action:
              action: "more-info"
            grid_options:
              columns: 12
              rows: 1
          -
            type: "history-graph"
            title: "Příkon · 24 hodin"
            hours_to_show: 24
            entities:
              -
                entity: "sensor.go_econtroller_917809_home_power"
                name: "Celkem včetně auta"
              -
                entity: "sensor.go_echarger_600187_power_total"
                name: "Z toho auto"
            grid_options:
              columns: 12
              rows: "auto"
          -
            type: "markdown"
            title: "Důležité změny · posledních 24 h"
            content: |-
              {% set ns=namespace(count=0) %}
              {% for event in state_attr('sensor.house_debug_events','events') or [] %}
              {% if as_timestamp(now()) - as_timestamp(event.at) < 86400 and ns.count < 8 and not event.entity.startswith('input_boolean.heating_window_') %}
              {% set ns.count=ns.count+1 %}
              **{{ as_timestamp(event.at) | timestamp_custom('%H:%M') }}** · {{ event.message }}

              {% endif %}
              {% endfor %}
              {% if ns.count == 0 %}Zatím bez zachycených změn. Výpis se plní od nasazení.{% endif %}

              [Delší výpis a historie](/house-debug/heating)
            grid_options:
              columns: 12
              rows: "auto"
      -
        type: "grid"
        cards:
          -
            type: "markdown"
            title: "Vodní šachta · skladování"
            content: |-
              {% set t=states('sensor.water_shaft_temperature_sensor_temperature') %}
              {% if is_number(t) %}
              **Teď {{ t }} °C** · {% if t|float < 1 %}**blízko mrazu — zkontroluj uložené plodiny**{% elif t|float < 3 %}**chladno — sleduj další pokles**{% else %}bez aktuálního upozornění na přílišný chlad{% endif %}.
              {% else %}Čidlo teď nemá dostupnou teplotu.{% endif %}

              Graf ukazuje denní minimum, průměr a maximum za 30 dní.

              <details><summary>Jablka a brambory · co z teploty poznám?</summary>

              Jablkům vyhovuje přibližně 0–4 °C, bramborám podle použití asi 4–10 °C. Pro brambory je důležitá tma; oba druhy potřebují vhodnou vlhkost a větrání. Nedávej je těsně k sobě kvůli ethylenu z jablek. Vlhkost v šachtě tímto čidlem neměříme.

              [Podmínky skladování](https://extension.umn.edu/agriculture/specialty-crops/commercial-fruit-production/postharvest-handling-of-fruit-and-vegetable-crops-in-minnesota) · [Brambory a jablka](https://extension.sdstate.edu/harvesting-and-storing-root-vegetables)

              </details>
            grid_options:
              columns: 12
              rows: "auto"
          -
            type: "statistics-graph"
            title: "Vodní šachta · 30 dní"
            entities:
              -
                entity: "sensor.water_shaft_temperature_sensor_temperature"
                name: "Teplota v šachtě"
            days_to_show: 30
            period: "day"
            stat_types:
              - "min"
              - "mean"
              - "max"
            chart_type: "line"
            grid_options:
              columns: 12
              rows: 5
