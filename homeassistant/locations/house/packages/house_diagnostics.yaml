# Read-only diagnostics. Mirrors boiler eligibility; never commands heating or charging.
# Event snapshots persist across restarts; only observed transitions are recorded.
template:
  -
    sensor:
      -
        name: "Ložnice"
        default_entity_id: "sensor.heating_debug_bedroom"
        unique_id: "heating_debug_bedroom"
        icon: "mdi:radiator"
        state: |-
          {% set climate = 'climate.bedroom_radiator_heat_valve' %}
          {% set measured = states('sensor.bedroom_temperature_sensor_temperature') %}
          {% set target = state_attr(climate, 'temperature') %}
          {% set contacts = ['binary_sensor.bedroom_window_sensor_contact'] %}
          {% set ns = namespace(closed=true, missing=false) %}
          {% for c in contacts %}
            {% if not is_state(c, 'off') %}{% set ns.closed = false %}{% endif %}
            {% if not has_value(c) %}{% set ns.missing = true %}{% endif %}
          {% endfor %}
          {% set emitter = state_attr('climate.bedroom_radiator_heat_valve', 'hvac_action') == 'heating' %}
          {% if not has_value(climate) or not is_number(measured) or not is_number(target) %}Chybí data
          {% elif ns.missing %}Neznámý stav okna
          {% elif not ns.closed %}Otevřené okno
          {% elif is_state('input_boolean.heating_window_bedroom', 'on') %}Čeká na obnovu po okně
          {% elif states(climate) not in ['heat', 'auto'] %}Vypnuto
          {% elif measured | float >= target | float %}Dosaženo
          {% elif not emitter %}Čeká na ventil
          {% elif measured | float < target | float - 1 %}Žádá start
          {% elif is_state('switch.laundry_room_boiler_controller_l2', 'on') %}Udržuje běh
          {% else %}Čeká na pokles o 1 °C
          {% endif %}
        attributes:
          room_name: "Ložnice"
          climate_entity: "climate.bedroom_radiator_heat_valve"
          temperature_entity: "sensor.bedroom_temperature_sensor_temperature"
          measured: "{{ states('sensor.bedroom_temperature_sensor_temperature') | float(none) }}"
          target: "{{ state_attr('climate.bedroom_radiator_heat_valve', 'temperature') }}"
          window_state: |-
            {% set climate = 'climate.bedroom_radiator_heat_valve' %}
            {% set measured = states('sensor.bedroom_temperature_sensor_temperature') %}
            {% set target = state_attr(climate, 'temperature') %}
            {% set contacts = ['binary_sensor.bedroom_window_sensor_contact'] %}
            {% set ns = namespace(closed=true, missing=false) %}
            {% for c in contacts %}
              {% if not is_state(c, 'off') %}{% set ns.closed = false %}{% endif %}
              {% if not has_value(c) %}{% set ns.missing = true %}{% endif %}
            {% endfor %}
            {% set emitter = state_attr('climate.bedroom_radiator_heat_valve', 'hvac_action') == 'heating' %}
            {% if not contacts %}none{% elif ns.missing %}unknown{% elif not ns.closed %}open{% elif is_state('input_boolean.heating_window_bedroom', 'on') %}restoring{% else %}closed{% endif %}
          start_requested: |-
            {% set climate = 'climate.bedroom_radiator_heat_valve' %}
            {% set measured = states('sensor.bedroom_temperature_sensor_temperature') %}
            {% set target = state_attr(climate, 'temperature') %}
            {% set contacts = ['binary_sensor.bedroom_window_sensor_contact'] %}
            {% set ns = namespace(closed=true, missing=false) %}
            {% for c in contacts %}
              {% if not is_state(c, 'off') %}{% set ns.closed = false %}{% endif %}
              {% if not has_value(c) %}{% set ns.missing = true %}{% endif %}
            {% endfor %}
            {% set emitter = state_attr('climate.bedroom_radiator_heat_valve', 'hvac_action') == 'heating' %}
            {{ states(climate) in ['heat', 'auto'] and ns.closed and is_number(measured) and is_number(target) and emitter and measured | float < target | float - 1 }}
          keep_requested: |-
            {% set climate = 'climate.bedroom_radiator_heat_valve' %}
            {% set measured = states('sensor.bedroom_temperature_sensor_temperature') %}
            {% set target = state_attr(climate, 'temperature') %}
            {% set contacts = ['binary_sensor.bedroom_window_sensor_contact'] %}
            {% set ns = namespace(closed=true, missing=false) %}
            {% for c in contacts %}
              {% if not is_state(c, 'off') %}{% set ns.closed = false %}{% endif %}
              {% if not has_value(c) %}{% set ns.missing = true %}{% endif %}
            {% endfor %}
            {% set emitter = state_attr('climate.bedroom_radiator_heat_valve', 'hvac_action') == 'heating' %}
            {{ states(climate) in ['heat', 'auto'] and ns.closed and is_number(measured) and is_number(target) and emitter and measured | float < target | float }}
