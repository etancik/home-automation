    conditions:
      -
        condition: "template"
        value_template: "{{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state not in ['unknown','unavailable'] and trigger.to_state.state not in ['unknown','unavailable'] and (trigger.from_state.state != trigger.to_state.state or (trigger.entity_id.startswith('climate.') and trigger.to_state.state in ['heat','auto'] and trigger.from_state.attributes.get('temperature') != trigger.to_state.attributes.get('temperature'))) }}"
    actions:
      -
        variables:
          message: |-
            {% set names = {'switch.laundry_room_boiler_controller_l2': 'Kotel', 'input_boolean.heating_enabled': 'Povolení topení', 'input_boolean.heating_safety_lock': 'Bezpečnostní zámek', 'input_boolean.ev_dynamic_load_balancing_enabled': 'Load balancing', 'sensor.go_echarger_600187_car_state': 'Nabíjení', 'input_boolean.washing_machine_running': 'Pračka', 'binary_sensor.living_room_smoke_detector_smoke': 'Kouř v obýváku', 'binary_sensor.shellyplussmoke_28562fcca298_smoke': 'Kouř · Shelly', 'binary_sensor.downstairs_bathroom_leak_sensor_water_leak': 'Únik vody · koupelna dole', 'binary_sensor.upstairs_bathroom_leak_sensor_water_leak': 'Únik vody · koupelna nahoře', 'binary_sensor.laundry_room_leak_sensor_water_leak': 'Únik vody · prádelna', 'binary_sensor.kitchen_sink_leak_sensor_water_leak': 'Únik vody · kuchyň', 'binary_sensor.bedroom_window_sensor_contact': 'Okno · ložnice', 'binary_sensor.kids_room_window_sensor_contact': 'Okno · dětský pokoj', 'binary_sensor.workshop_window_sensor_contact': 'Okno · pracovna', 'binary_sensor.entrance_door_sensor_contact': 'Vchodové dveře', 'binary_sensor.kitchen_window_sensor_contact': 'Okno · kuchyň', 'binary_sensor.living_room_door_sensor_contact': 'Zahradní dveře', 'climate.bedroom_radiator_heat_valve': 'Ložnice', 'climate.kids_room_radiator_heat_valve': 'Dětský pokoj', 'climate.workshop_radiator_heat_valve': 'Pracovna', 'climate.entrance_radiator_heat_valve': 'Chodba', 'climate.downstairs_bathroom_radiator_heat_valve': 'Koupelna dole · radiátor', 'climate.downstairs_bathroom_floor_heating': 'Koupelna dole · podlaha', 'climate.upstairs_bathroom_radiator_heat_valve': 'Koupelna nahoře', 'climate.living_room_floor_heating': 'Obývák · podlaha'} %}
            {% set entity = trigger.entity_id %}
            {% set value = trigger.to_state.state %}
            {% if entity == 'switch.laundry_room_boiler_controller_l2' %}
              {% set zones = expand(['sensor.heating_debug_bedroom', 'sensor.heating_debug_kids_room', 'sensor.heating_debug_workshop', 'sensor.heating_debug_entrance', 'sensor.heating_debug_downstairs_bathroom', 'sensor.heating_debug_downstairs_bathroom_floor', 'sensor.heating_debug_upstairs_bathroom', 'sensor.heating_debug_living_room']) | list %}
              {% set requesters = zones | selectattr('attributes.keep_requested', 'eq', true) | map(attribute='attributes.room_name') | list %}
              {% if value == 'on' %}Kotel: povel zapnut · {{ requesters | join(', ') if requesters else 'bez platného požadavku zón' }}
              {% elif is_state('input_boolean.heating_safety_lock','on') %}Kotel: povel vypnut · bezpečnostní zámek
              {% elif is_state('input_boolean.heating_enabled','off') %}Kotel: povel vypnut · topení zakázáno
              {% else %}Kotel: povel vypnut · {{ 'zbývající požadavky: ' ~ (requesters | join(', ')) if requesters else 'žádná zóna už nežádá běh' }}
              {% endif %}
            {% elif entity.startswith('climate.') %}
              {% set temperature = trigger.to_state.attributes.get('temperature') %}
              {{ names[entity] }}: {{ dict(off='vypnuto',heat='topení',auto='automatika').get(value,value) }}{% if value != 'off' and is_number(temperature) %} · cíl {{ temperature }} °C{% endif %}
            {% elif entity == 'sensor.go_echarger_600187_car_state' %}
              Nabíjení: {{ dict(Idle='odpojeno',Charging='nabíjí',WaitCar='čeká na auto',Complete='dokončeno',Error='chyba').get(value,value) }}
              {% if value in ['Complete','Idle'] and is_number(states('sensor.go_echarger_600187_energy_charged')) %} · {{ (states('sensor.go_echarger_600187_energy_charged') | float / 1000) | round(2) }} kWh{% endif %}
            {% elif entity == 'input_boolean.washing_machine_running' %}
              Pračka: {{ 'cyklus zahájen' if value == 'on' else 'cyklus ukončen podle příkonu' }}
            {% elif entity in ['binary_sensor.bedroom_window_sensor_contact', 'binary_sensor.kids_room_window_sensor_contact', 'binary_sensor.workshop_window_sensor_contact', 'binary_sensor.entrance_door_sensor_contact', 'binary_sensor.kitchen_window_sensor_contact', 'binary_sensor.living_room_door_sensor_contact'] %}
              {{ names[entity] }}: {{ 'otevřeno' if value == 'on' else 'zavřeno' }}
            {% else %}
              {{ names[entity] }}: {{ 'zapnuto' if value == 'on' else 'vypnuto' }}
            {% endif %}
    sensor:
      -
        name: "Důležité změny domu"
        default_entity_id: "sensor.house_debug_events"
        unique_id: "house_debug_events"
        icon: "mdi:timeline-text-outline"
        state: "{{ message | trim | truncate(250, true) }}"
        attributes:
          events: "{{ ([dict(at=now().isoformat(), message=message | trim, entity=trigger.entity_id)] + ((this.attributes.get('events') or []) | rejectattr('entity','match','input_boolean.heating_window_') | list))[:100] }}"
