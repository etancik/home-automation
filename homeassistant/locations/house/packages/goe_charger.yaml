# go-e Charger Integration Package
# GitOps managed via Git Pull add-on
#
# Hardware:
# - go-e Charger PRO CORE V2X (11-22kW) - Serial: 600187
# - go-eController - Serial: 917809
#
# MQTT Auto-Discovery (ENABLED):
# All entities are automatically created via MQTT discovery.
# Settings in go-e app → Internet → MQTT:
#   - "MQTT homeassistant enabled" = ON
#   - "MQTT homeassistant prefix" = homeassistant
#
# Device Pages:
# - Charger: http://homeassistant.local:8123/config/devices/device/10632f297da9f6c23a6d35ba7da3a5f0
# - Controller: http://homeassistant.local:8123/config/devices/device/201c76e1d31dca01629490bb0636c8a7
#
# Documentation: https://github.com/goecharger/go-eCharger-API-v2

# ========================================
# ENTITY CUSTOMIZATIONS
# ========================================
# Friendly names for better HomeKit and UI display
#
# Note: Device names (shown in device pages) must be changed via UI:
# Settings → Devices & Services → MQTT → Devices → Click device → Settings icon → Rename
# Recommended device names:
#   - "Car Charger" (currently: go-eCharger 600187)
#   - "House Power Monitor" (currently: go-eController 917809)

# Repair firmware discovery metadata without writing charger/controller settings.
# Guards exclude repaired payloads to prevent same-topic feedback loops.
automation:
  - id: goe_repair_mqtt_discovery
    alias: Go-e - repair MQTT discovery
    mode: queued
    max: 10
    triggers:
      - trigger: mqtt
        topic: homeassistant/sensor/go-e_917809/brightness_sensor/config
        id: brightness
      - trigger: mqtt
        topic: homeassistant/sensor/go-e_600187/error_state/config
        id: error_state
      - trigger: mqtt
        topic: homeassistant/switch/go-e_600187/force_single_phase/config
        id: single_phase
    conditions:
      - condition: template
        value_template: "{{ trigger.payload_json is defined and trigger.payload_json is mapping }}"
    actions:
      - variables:
          source: "{{ trigger.payload_json }}"
      - choose:
          - conditions: >-
              {{ trigger.id == 'brightness'
                 and source.get('device_class', source.get('dev_cla')) == 'illuminance'
                 and source.get('unit_of_measurement', source.get('unit_of_meas')) == '%' }}
            sequence:
              - action: mqtt.publish
                data:
                  topic: "{{ trigger.topic }}"
                  payload: >-
                    {{ dict(source.items() | rejectattr('0', 'in', ['device_class', 'dev_cla']) | list) | to_json }}
                  retain: true
          - conditions: >-
              {{ trigger.id == 'error_state'
                 and source.get('options', source.get('ops', [])) | first == 'None' }}
            sequence:
              - variables:
                  template_key: "{{ 'value_template' if 'value_template' in source else 'val_tpl' }}"
                  options_key: "{{ 'options' if 'options' in source else 'ops' }}"
              - action: mqtt.publish
                data:
                  topic: "{{ trigger.topic }}"
                  payload: >-
                    {{ dict(source, **{
                      template_key: source[template_key].replace("'None'", "'NoError'").replace('"None"', '"NoError"'),
                      options_key: ['NoError'] + source[options_key][1:]
                    }) | to_json }}
                  retain: true
          - conditions: >-
              {{ trigger.id == 'single_phase'
                 and (source.get('payload_on', source.get('pl_on')) != 'true'
                      or source.get('payload_off', source.get('pl_off')) != 'false') }}
            sequence:
              - action: mqtt.publish
                data:
                  topic: "{{ trigger.topic }}"
                  payload: >-
                    {{ dict(dict(source.items() | rejectattr('0', 'in',
                      ['payload_on', 'payload_off', 'pl_on', 'pl_off']) | list),
                      payload_on='true', payload_off='false') | to_json }}
                  retain: true

homeassistant:
  customize:
    # EV Charger - Monitoring
    sensor.go_echarger_600187_car_state:
      friendly_name: "Car Connection Status"
    sensor.go_echarger_600187_power_total:
      friendly_name: "Charging Power"
    sensor.go_echarger_600187_energy_charged:
      friendly_name: "Session Energy"
    sensor.go_echarger_600187_total_energy_charged:
      friendly_name: "Total Charged (Lifetime)"
    sensor.go_echarger_600187_allowed_charge_current:
      friendly_name: "Current Limit"

    # EV Charger - Controls
    number.go_echarger_600187_set_max_ampere_limit:
      friendly_name: "Max Charging Current"
    select.go_echarger_600187_force_state:
      friendly_name: "Force Charge State"

    # Power Monitor - Grid Monitoring
    sensor.go_econtroller_917809_grid_power:
      friendly_name: "Grid Import/Export"
    sensor.go_econtroller_917809_home_power:
      friendly_name: "Total Household Power"
    sensor.go_econtroller_917809_car_power:
      friendly_name: "Car Power Draw"

# Energy dashboard sensors derived from go-eController readings.
template:
  - sensor:
      # Grid Energy Consumption (fixed state_class for Energy dashboard)
      - name: "Grid Energy Consumed"
        unique_id: grid_energy_consumed
        state: "{{ states('sensor.go_econtroller_917809_grid_energy_in') | float(0) }}"
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.go_econtroller_917809_grid_energy_in') }}"
        attributes:
          friendly_name: "Grid Energy Consumed"
          source: "go-eController Grid Energy In (state_class fixed)"

      # Home Energy Consumption (fixed state_class for Energy dashboard)
      - name: "Home Energy Consumed"
        unique_id: home_energy_consumed
        state: "{{ states('sensor.go_econtroller_917809_home_energy_in') | float(0) }}"
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ has_value('sensor.go_econtroller_917809_home_energy_in') }}"
        attributes:
          friendly_name: "Home Energy Consumed"
          source: "go-eController Home Energy In (state_class fixed)"
