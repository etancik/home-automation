# Twinkly stair lights: use the saved Rainbow movie by day and static color by night.
automation:
  - id: twinkly_stairs_sun_schedule
    alias: Twinkly stairs sun schedule
    description: Rainbow at 10% after sunrise; saved static color at brightness 8 after sunset.
    triggers:
      - trigger: sun
        event: sunrise
        id: day
      - trigger: sun
        event: sunset
        id: night
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'day' }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: select.home_stairs_mode
                data:
                  option: movie
              - action: light.turn_on
                target:
                  entity_id: light.home_stairs
                data:
                  brightness: 26
                  effect: '3 Rainbow'
          - conditions: "{{ trigger.id == 'night' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.home_stairs
                data:
                  brightness: 8
              - action: select.select_option
                target:
                  entity_id: select.home_stairs_mode
                data:
                  option: color
    mode: single
