# Twinkly stair lights: use the saved Rainbow movie by day and static color by night.
automation:
  - id: twinkly_stairs_sun_schedule
    alias: Twinkly stairs sun schedule
    description: Rainbow at 10% after sunrise; saved static color at brightness 8 after sunset.
    triggers:
      - trigger: sun
        event: sunrise
        id: day
      - trigger: sun
        event: sunset
        id: night
    actions:
      - choose:
          - conditions: "{{ trigger.id == 'day' }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: select.home_stairs_mode
                data:
                  option: movie
              - action: light.turn_on
                target:
                  entity_id: light.home_stairs
                data:
                  brightness: 26
                  effect: '3 Rainbow'
          - conditions: "{{ trigger.id == 'night' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.home_stairs
                data:
                  brightness: 8
              - action: select.select_option
                target:
                  entity_id: select.home_stairs_mode
                data:
                  option: color
    mode: single

  # The physical button remains usable; repair an active light every five minutes.
  - id: twinkly_stairs_night_guard
    alias: Twinkly stairs night guard
    description: Restore the saved static color and brightness 8 at night; leave an off light off.
    triggers:
      - trigger: time_pattern
        minutes: '/5'
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: state
        entity_id: light.home_stairs
        state: 'on'
      - condition: template
        value_template: >-
          {{ states('select.home_stairs_mode') not in ['unknown', 'unavailable', 'off']
             and is_number(state_attr('light.home_stairs', 'brightness')) }}
    actions:
      - if:
          - condition: template
            value_template: "{{ state_attr('light.home_stairs', 'brightness') | int != 8 }}"
        then:
          - action: light.turn_on
            target:
              entity_id: light.home_stairs
            data:
              brightness: 8
      - if:
          - condition: template
            value_template: "{{ not is_state('select.home_stairs_mode', 'color') }}"
        then:
          - condition: state
            entity_id: light.home_stairs
            state: 'on'
          - condition: template
            value_template: "{{ states('select.home_stairs_mode') not in ['unknown', 'unavailable', 'off'] }}"
          - action: select.select_option
            target:
              entity_id: select.home_stairs_mode
            data:
              option: color
    mode: single
