input_boolean:
  living_room_magic_cancel_requested:
    name: Living Room Magic - cancel requested
    initial: false

input_button:
  living_room_magic_press:
    name: Living Room Magic - last press

script:
  living_room_magic_round:
    alias: Kouzelný obývák
    mode: single
    sequence:
      - condition: template
        value_template: >-
          {{ is_state('script.cinema_lighting', 'off')
             and is_state('input_boolean.cinema_active', 'off')
             and is_state('input_boolean.cinema_applying', 'off') }}
      - variables:
          lights:
            - light.living_room_fireplace_light
            - light.living_room_palm_light
            - light.living_room_bookshelf_light
            - light.living_room_lamp
          start_hue: "{{ range(360) | random }}"
      - condition: template
        value_template: "{{ expand(lights) | selectattr('state', 'in', ['on', 'off']) | list | count == lights | count }}"
      - action: scene.create
        data:
          scene_id: living_room_magic_before
          snapshot_entities: "{{ lights }}"
      - repeat:
          sequence:
            - variables:
                last_press: "{{ states('input_button.living_room_magic_press') }}"
            - if: "{{ is_state('input_boolean.living_room_magic_cancel_requested', 'off') }}"
              then:
                - action: light.turn_on
                  continue_on_error: true
                  target:
                    entity_id: "{{ lights }}"
                  data:
                    hs_color: "{{ [(start_hue + (repeat.index - 1) * 72) % 360, 80] }}"
                    brightness_pct: 45
                    transition: 1.5
            # Multiple taps during the fade become at most one pending color change.
            - wait_template: "{{ is_state('input_boolean.living_room_magic_cancel_requested', 'on') }}"
              timeout: 2
            - wait_template: >-
                {{ is_state('input_boolean.living_room_magic_cancel_requested', 'on')
                   or states('input_button.living_room_magic_press') != last_press }}
              timeout: 4
          until: "{{ is_state('input_boolean.living_room_magic_cancel_requested', 'on') or not wait.completed }}"
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id: scene.living_room_magic_before
        data:
          transition: 1
      # Allow the lights to report restored states while the time profile is still paused.
      - delay: 2
      - action: scene.delete
        continue_on_error: true
        target:
          entity_id: scene.living_room_magic_before
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.living_room_magic_cancel_requested

  living_room_magic_cancel:
    alias: Living Room Magic - restore before other controls
    mode: parallel
    sequence:
      - condition: state
        entity_id: script.living_room_magic_round
        state: 'on'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.living_room_magic_cancel_requested
      - wait_template: "{{ is_state('script.living_room_magic_round', 'off') }}"

automation:
  - id: living_room_magic_button
    alias: Living Room Magic - Zigbee button
    mode: queued
    triggers:
      # Paired SONOFF SNZB-01P, identified in Zigbee2MQTT by its IEEE address.
      - trigger: mqtt
        topic: zigbee2mqtt/0xf044d3fffeba48f1
        value_template: "{{ 'play' if (value_json.action | default('')) in ['single', 'double'] else '' }}"
        payload: play
    actions:
      - if: "{{ is_state('script.living_room_magic_round', 'on') }}"
        then:
          - action: input_button.press
            target:
              entity_id: input_button.living_room_magic_press
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.living_room_magic_cancel_requested
          - action: script.turn_on
            target:
              entity_id: script.living_room_magic_round
