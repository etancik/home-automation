# Persistent cycle tracking; preserve the existing HomeKit contact identity.
input_boolean:
  washing_machine_running:
    name: Washing machine running
input_number:
  washing_machine_high_since:
    name: Washing machine active power since
    min: 0
    max: 4102444800
    step: 1
    mode: box
  washing_machine_low_since:
    name: Washing machine standby power since
    min: 0
    max: 4102444800
    step: 1
    mode: box
  washing_machine_zero_since:
    name: Washing machine near-zero power since
    min: 0
    max: 4102444800
    step: 1
    mode: box

template:
  - binary_sensor:
      # OFF = confirmed running; ON = done/idle. No startup delay timer.
      - name: Washing Machine
        unique_id: washing_machine_done
        device_class: opening
        state: "{{ is_state('input_boolean.washing_machine_running', 'off') }}"
        availability: "{{ is_number(states('sensor.laundry_room_washing_machine_smart_plug_power')) and has_value('input_boolean.washing_machine_running') }}"
sensor:
  - platform: integration
    source: sensor.laundry_room_washing_machine_smart_plug_power
    name: Washing Machine Energy
    unique_id: washing_machine_energy
    unit_prefix: k
    round: 2
    method: left

automation:
  - id: washing_machine_status_logging
    alias: Washing Machine Status Logging
    description: Confirm start after 2 min above 10 W; finish after 2 min below 1 W or 16 min at most 10 W, once per cycle.
    mode: queued
    max: 10
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.laundry_room_washing_machine_smart_plug_power
      - trigger: time_pattern
        seconds: /15
    actions:
      - variables:
          reading: "{{ states('sensor.laundry_room_washing_machine_smart_plug_power') }}"
          stamp: "{{ as_timestamp(now()) | int }}"
          high: "{{ states('input_number.washing_machine_high_since') | float(0) }}"
          low: "{{ states('input_number.washing_machine_low_since') | float(0) }}"
          zero: "{{ states('input_number.washing_machine_zero_since') | float(0) }}"
      - if: "{{ not is_number(reading) }}"
        then:
          # Missing data never counts as quiet time or completes a cycle.
          - action: input_number.set_value
            target:
              entity_id:
                - input_number.washing_machine_high_since
                - input_number.washing_machine_low_since
                - input_number.washing_machine_zero_since
            data:
              value: 0
        else:
          - choose:
              - conditions: "{{ reading | float > 10 }}"
                sequence:
                  - action: input_number.set_value
                    target:
                      entity_id:
                        - input_number.washing_machine_low_since
                        - input_number.washing_machine_zero_since
                    data:
                      value: 0
                  - if: "{{ high <= 0 }}"
                    then:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.washing_machine_high_since
                        data:
                          value: "{{ stamp }}"
                    else:
                      - if: "{{ stamp - high >= 120 and is_state('input_boolean.washing_machine_running', 'off') }}"
                        then:
                          - action: input_boolean.turn_on
                            target:
                              entity_id: input_boolean.washing_machine_running
                          - action: logbook.log
                            data:
                              name: Washing Machine
                              entity_id: binary_sensor.washing_machine
                              message: Washing started - power above 10 W for 2 min
            default:
              - action: input_number.set_value
                target:
                  entity_id: input_number.washing_machine_high_since
                data:
                  value: 0
              - if: "{{ low <= 0 }}"
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.washing_machine_low_since
                    data:
                      value: "{{ stamp }}"
              - if: "{{ reading | float < 1 }}"
                then:
                  - if: "{{ zero <= 0 }}"
                    then:
                      - action: input_number.set_value
                        target:
                          entity_id: input_number.washing_machine_zero_since
                        data:
                          value: "{{ stamp }}"
                else:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.washing_machine_zero_since
                    data:
                      value: 0
              - if: >-
                  {{ is_state('input_boolean.washing_machine_running', 'on')
                     and ((reading | float < 1 and zero > 0 and stamp - zero >= 120)
                          or (low > 0 and stamp - low >= 960)) }}
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.washing_machine_running
                  - action: logbook.log
                    data:
                      name: Washing Machine
                      entity_id: binary_sensor.washing_machine
                      message: >-
                        Washing finished - {{ 'power below 1 W for 2 min' if reading | float < 1 and zero > 0 and stamp - zero >= 120 else 'power at most 10 W for 16 min' }}
