# Washing machine status, energy tracking and logging.
template:
  - binary_sensor:
      # Washing Machine Status (HomeKit Contact Sensor)
      # Closed (OFF) = Running (power >10W, busy)
      # Open (ON) = Done/Idle (power ≤10W, available)
      # Data: 29 days correlated with dryer (37 loads). Max mid-cycle gap: 15.8min.
      # 16min = zero false triggers. Soak pauses are bimodal: <3min or 10-16min.
      # Setup in HomeKit: Automation → When "Washing Machine" opens → Send notification
      - name: "Washing Machine"
        unique_id: washing_machine_done
        device_class: opening
        delay_on:
          minutes: 16
        state: >
          {{ states('sensor.laundry_room_washing_machine_smart_plug_power') | float(0) <= 10 }}
        availability: >
          {{ states('sensor.laundry_room_washing_machine_smart_plug_power') not in ['unknown', 'unavailable'] }}

# Energy Tracking for Washing Machine
# Uses Riemann sum integration to convert power (W) to energy (kWh)
sensor:
  # Washing Machine Energy Tracking
  - platform: integration
    source: sensor.laundry_room_washing_machine_smart_plug_power
    name: "Washing Machine Energy"
    unique_id: washing_machine_energy
    unit_prefix: k
    round: 2
    method: left

automation:
  # Washing Machine Status Logging
  # Log when washing machine starts and finishes
  # Binary sensor automatically updates: closed=running (>10W), open=done/idle (≤10W)
  - id: 'washing_machine_status_logging'
    alias: "Washing Machine Status Logging"
    description: "Log washing machine state changes to logbook"
    triggers:
      # When washing starts (power stays above 10W for 2 min to avoid mid-cycle oscillation false triggers)
      - platform: numeric_state
        entity_id: sensor.laundry_room_washing_machine_smart_plug_power
        above: 10
        for:
          minutes: 2
        id: "start"
      # When washing finishes (power drops below 10W for 16 min to avoid mid-cycle false triggers)
      # Data: 29 days of power data correlated with dryer runs (37 loads = ground truth).
      # True mid-cycle gaps: max 15.8min (bimodal: <3min or 10-16min soak pauses).
      # 16min covers 100% of mid-cycle gaps with zero false triggers.
      - platform: numeric_state
        entity_id: sensor.laundry_room_washing_machine_smart_plug_power
        below: 10
        for:
          minutes: 16
        id: "done"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: "start"
            sequence:
              - service: logbook.log
                data:
                  name: "Washing Machine"
                  message: "Washing started - power above 10W"
          - conditions:
              - condition: trigger
                id: "done"
            sequence:
              - service: logbook.log
                data:
                  name: "Washing Machine"
                  message: "Washing finished - power below 10W for 16 min"
    mode: restart
