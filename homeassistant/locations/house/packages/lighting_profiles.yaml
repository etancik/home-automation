# Remember the nearest sun event through its +15 minute half and HA restarts.
template:
  - triggers:
      - trigger: time_pattern
        minutes: '/1'
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sun.sun
    sensor:
      - name: Lighting Sun Transition
        unique_id: lighting_sun_transition
        state: >-
          {% set old = this.state | float(0) %}
          {% set rising = as_timestamp(state_attr('sun.sun', 'next_rising'), 0) %}
          {% set setting = as_timestamp(state_attr('sun.sun', 'next_setting'), 0) %}
          {% if old > 0 and old + 960 > as_timestamp(now()) %}
            {{ old }}
          {% elif rising > 0 and setting > 0 %}
            {{ [rising, setting] | min }}
          {% else %}
            {{ old }}
          {% endif %}
        attributes:
          rising: >-
            {% set old = this.state | float(0) %}
            {% if old > 0 and old + 960 > as_timestamp(now()) %}
              {{ this.attributes.get('rising', false) }}
            {% else %}
              {{ as_timestamp(state_attr('sun.sun', 'next_rising'), 0)
                 < as_timestamp(state_attr('sun.sun', 'next_setting'), 0) }}
            {% endif %}

# Automatic profiles apply only to lit zones outside manual mode.
input_boolean:
  lighting_manual_living_room_front:
    name: Living Room Front - Manual Lighting
    icon: mdi:hand-back-right
  lighting_manual_living_room_rear:
    name: Living Room Rear - Manual Lighting
    icon: mdi:hand-back-right
  lighting_manual_kitchen_counter:
    name: Kitchen Counter - Manual Lighting
    icon: mdi:hand-back-right
  lighting_manual_kitchen_table:
    name: Kitchen Table - Manual Lighting
    icon: mdi:hand-back-right

script:
  lighting_turn_on_with_time_profile:
    alias: Lighting - turn on with time profile
    mode: queued
    max: 10
    fields:
      profile_transition:
        name: Profile transition in seconds
        default: 1
        selector:
          number:
            min: 0
            max: 60
      only_lit:
        name: Update only lights already on
        default: false
        selector:
          boolean:
      light_entity:
        name: Light or group
        required: true
        selector:
          entity:
            domain: light
    sequence:
      - condition: template
        value_template: >-
          {{ light_entity in ['light.living_room_front', 'light.living_room_rear',
                              'light.kitchen_counter_light', 'light.kitchen_table_light']
             and has_value(light_entity) }}
      - condition: template
        value_template: >-
          {{ light_entity not in ['light.living_room_front', 'light.living_room_rear']
             or (not is_state('input_boolean.cinema_active', 'on')
                 and not is_state('input_boolean.cinema_applying', 'on')) }}
      - variables:
          selected_lights: >-
            {{ expand(state_attr(light_entity, 'entity_id') or [light_entity]) | selectattr('state', 'eq', 'on')
               | map(attribute='entity_id') | list
               if only_lit | default(false) else [light_entity] }}
          manual_helper: >-
            {{ {'light.living_room_front': 'input_boolean.lighting_manual_living_room_front',
                'light.living_room_rear': 'input_boolean.lighting_manual_living_room_rear',
                'light.kitchen_counter_light': 'input_boolean.lighting_manual_kitchen_counter',
                'light.kitchen_table_light': 'input_boolean.lighting_manual_kitchen_table'}[light_entity] }}
      - condition: template
        value_template: "{{ selected_lights | count > 0 }}"
      - choose:
          - conditions: "{{ not is_state(manual_helper, 'off') }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: "{{ selected_lights }}"
          - conditions: "{{ states('sun.sun') in ['above_horizon', 'below_horizon'] }}"
            sequence:
              - variables:
                  daylight: >-
                    {% set event = states('sensor.lighting_sun_transition') | float(0) %}
                    {% set progress = (as_timestamp(now()) - event + 900) / 1800 %}
                    {% if event > 0 and 0 <= progress <= 1 %}
                      {{ progress if state_attr('sensor.lighting_sun_transition', 'rising') else 1 - progress }}
                    {% else %}
                      {{ 1 if is_state('sun.sun', 'above_horizon') else 0 }}
                    {% endif %}
              - action: light.turn_on
                target:
                  entity_id: "{{ selected_lights }}"
                data:
                  color_temp_kelvin: "{{ (2237 + 1763 * daylight | float) | round(0) | int }}"
                  brightness_pct: "{{ (75 + 25 * daylight | float) | round(0) | int }}"
                  transition: "{{ profile_transition | default(1) }}"
        default:
          - action: light.turn_on
            target:
              entity_id: "{{ selected_lights }}"

automation:
  - id: lighting_refresh_time_profiles
    alias: Lighting - refresh time profiles
    description: Apply profiles on switch-on and gradually from 15 minutes before to 15 minutes after sunrise/sunset.
    mode: queued
    max: 20
    triggers:
      - trigger: time_pattern
        minutes: '/1'
        id: gradual
      - trigger: state
        entity_id: sun.sun
        to:
          - above_horizon
          - below_horizon
      - trigger: state
        entity_id:
          - light.living_room_front
          - light.living_room_rear
          # Group state turns on with the first bulb; later reports need their own refresh.
          - light.living_room_fireplace_light
          - light.living_room_palm_light
          - light.living_room_bookshelf_light
          - light.kitchen_counter_light
          - light.kitchen_table_light
        from: 'off'
        to: 'on'
    actions:
      - condition: template
        value_template: >-
          {{ trigger is not defined or trigger.id | default('') != 'gradual'
             or (states('sensor.lighting_sun_transition') | float(0) - as_timestamp(now())) | abs <= 960 }}
      - repeat:
          for_each:
            - light: light.living_room_front
              manual: input_boolean.lighting_manual_living_room_front
            - light: light.living_room_rear
              manual: input_boolean.lighting_manual_living_room_rear
            - light: light.kitchen_counter_light
              manual: input_boolean.lighting_manual_kitchen_counter
            - light: light.kitchen_table_light
              manual: input_boolean.lighting_manual_kitchen_table
          sequence:
            - if: >-
                {{ is_state(repeat.item.light, 'on') and is_state(repeat.item.manual, 'off')
                   and (trigger is not defined or trigger.entity_id is not defined
                        or trigger.entity_id == 'sun.sun' or trigger.entity_id == repeat.item.light
                        or trigger.entity_id in (state_attr(repeat.item.light, 'entity_id') or [])) }}
              then:
                - action: script.lighting_turn_on_with_time_profile
                  data:
                    light_entity: "{{ repeat.item.light }}"
                    only_lit: true
                    profile_transition: "{{ 60 if trigger is defined and trigger.id | default('') == 'gradual' else 1 }}"

  - id: lighting_reset_manual_when_off
    alias: Lighting - reset manual mode when off
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - light.living_room_front
          - light.living_room_rear
          - light.kitchen_counter_light
          - light.kitchen_table_light
        from: 'on'
        to: 'off'
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: >-
            {{ {'light.living_room_front': 'input_boolean.lighting_manual_living_room_front',
                'light.living_room_rear': 'input_boolean.lighting_manual_living_room_rear',
                'light.kitchen_counter_light': 'input_boolean.lighting_manual_kitchen_counter',
                'light.kitchen_table_light': 'input_boolean.lighting_manual_kitchen_table'}[trigger.entity_id] }}
