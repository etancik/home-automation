# House lighting: physical dimmer and evening schedule.
automation:
  # Kids Room Dimmer Switch Control
  - id: 'kids_room_dimmer_switch_control'
    alias: "Kids Room Dimmer Switch Control"
    description: "Control kids room LED strip with IKEA RODRET wireless dimmer"
    triggers:
      # IKEA RODRET uses device automation - listen to MQTT events
      - platform: mqtt
        topic: zigbee2mqtt/Kids Room Dimmer Switch
        value_template: "{{ value_json.action }}"
    conditions:
      - condition: template
        value_template: "{{ trigger.payload_json.action is defined and trigger.payload_json.action != '' }}"
    actions:
      - choose:
          # ON button press - turn on LED strip
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload_json.action == 'on' }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.kids_room_door_led_strip

          # OFF button press - turn off LED strip
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload_json.action == 'off' }}"
            sequence:
              - service: light.turn_off
                target:
                  entity_id: light.kids_room_door_led_strip

          # Brightness move up - increase brightness
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload_json.action == 'brightness_move_up' }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.kids_room_door_led_strip
                data:
                  brightness_step_pct: 20

          # Brightness move down - decrease brightness
          - conditions:
              - condition: template
                value_template: "{{ trigger.payload_json.action == 'brightness_move_down' }}"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: light.kids_room_door_led_strip
                data:
                  brightness_step_pct: -20

          # Brightness stop - do nothing (just stops dimming)
          # This happens when user releases button after dimming
    mode: restart

  # LED Strip Schedule Control with Color Transitions
  - id: 'led_strips_evening_schedule'
    alias: "LED Strips Evening Schedule"
    description: "Start with shutters 10 minutes before sunset: yellow before 18:30, red afterwards; switch to red at 18:30 only after the evening start. Kids off 30 minutes before sunrise, bedroom off at sunrise."
    triggers:
      # Use the same evening start time as shading_v1_night_positions.
      - platform: sun
        event: sunset
        offset: "-00:10:00"
        id: "evening_on"
      # Switch to red at 6:30 PM
      - platform: time
        at: "18:30:00"
        id: "red_on"
      # Kids light follows the morning shutter opening time.
      - platform: sun
        event: sunrise
        offset: "-00:30:00"
        id: "kids_turn_off"
      # Bedroom strip keeps its sunrise switch-off.
      - platform: sun
        event: sunrise
        id: "turn_off"
    conditions: []
    actions:
      - choose:
          # Start yellow while the early-evening colour window is active.
          - conditions:
              - condition: trigger
                id: "evening_on"
              - condition: time
                before: "18:30:00"
            sequence:
              - service: light.turn_on
                target:
                  entity_id:
                    - light.bedroom_led_strip
                    - light.kids_room_door_led_strip
                data:
                  brightness_pct: 10
                  rgb_color: [255, 137, 14]  # Warm Orange-Yellow

          # In summer start directly in red when shutters close after 18:30.
          # The 18:30 trigger must never switch lights on before that start.
          - conditions:
              - condition: or
                conditions:
                  - condition: trigger
                    id: "evening_on"
                  - condition: and
                    conditions:
                      - condition: trigger
                        id: "red_on"
                      - condition: sun
                        after: sunset
                        after_offset: "-00:10:00"
            sequence:
              - service: light.turn_on
                target:
                  entity_id:
                    - light.bedroom_led_strip
                    - light.kids_room_door_led_strip
                data:
                  brightness_pct: 15
                  rgb_color: [255, 0, 0]  # Red

          - conditions:
              - condition: trigger
                id: "kids_turn_off"
            sequence:
              - service: light.turn_off
                target:
                  entity_id: light.kids_room_door_led_strip

          # Bedroom strip off at sunrise.
          - conditions:
              - condition: trigger
                id: "turn_off"
            sequence:
              - service: light.turn_off
                target:
                  entity_id: light.bedroom_led_strip
    mode: single
