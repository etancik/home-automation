name: Heating configuration
on:
  push:
    branches-ignore: [ha-config-house, ha-config-apartment]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heating:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build exact HA test runtime
        run: docker build -f tests/Dockerfile -t heating-tests .
      - name: Test production heating logic without network access
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE:/workspace" heating-tests --tb=short
      - name: Validate complete house configuration
        run: |
          python3 lab/prepare_validation.py
          docker run --rm --network none -v "$GITHUB_WORKSPACE/lab/.runtime/production-check:/config" ghcr.io/home-assistant/home-assistant:2026.9.2 python -m homeassistant --script check_config -c /config
      - name: Run MQTT integration and actual HA restart scenarios
        run: |
          python3 lab/prepare.py
          docker compose -f lab/compose.yaml up -d
          python3 lab/run_smoke.py
      - name: Lab diagnostics
        if: failure()
        run: docker compose -f lab/compose.yaml logs --tail 100
      - name: Stop lab
        if: always()
        run: docker compose -f lab/compose.yaml down
